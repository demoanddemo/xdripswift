name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit
  
  certificates:
    name: Create Certificates
    needs: validate
    runs-on: macos-26
    steps:
      # Uncomment to manually select latest Xcode if needed
      #- name: Select Latest Xcode
      #  run: "sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer"
      
      # Checks-out the repo
      - name: Checkout Repo
        uses: actions/checkout@v5
        
      # Install project dependencies
      - name: Install Project Dependencies
        run: bundle install

      # Patch Fastlane Match to not print tables and to auto-renew expired certificates
      - name: Patch Match Tables
        run: |
          FASTLANE_GEM_PATH="$(bundle info --path fastlane)"
          TABLE_PRINTER_PATH="$FASTLANE_GEM_PATH/match/lib/match/table_printer.rb"
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          fi
          MATCH_RUNNER_PATH="$FASTLANE_GEM_PATH/match/lib/match/runner.rb"
          if [ -f "$MATCH_RUNNER_PATH" ]; then
            sed -i "" "s/renew_expired_certs: false/renew_expired_certs: true/g" "$MATCH_RUNNER_PATH"
            sed -i "" "s/self.cache.reset_certificates/self.cache.reset_certificates; params[:force] = true/g" "$MATCH_RUNNER_PATH"
          fi

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      # Create or update certificates for app
      - name: Create Certificates
        run: bundle exec fastlane certs
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
